[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "receipt-ocr"
version = "1.0.0"
description = "Production receipt OCR and structured extraction pipeline."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }

# Every dependency below is load-bearing; there are no convenience additions.
dependencies = [
    # API surface and request validation.
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "python-multipart>=0.0.9",       # multipart/form-data uploads
    # Schema and configuration.
    "pydantic>=2.7,<3.0",
    "pydantic-settings>=2.3,<3.0",
    # Image handling and preprocessing.
    "opencv-python-headless>=4.9",   # headless: no GUI libs in the container
    "numpy>=1.26",
    "pillow>=10.3",                  # broader format decoding than OpenCV alone
    # OCR engine binding. The engine binary itself is a system package.
    "pytesseract>=0.3.10",
    # Structured logging and retry/backoff.
    "structlog>=24.1",
    "tenacity>=8.2",
    # HTTP client for cloud OCR / LLM providers.
    "httpx>=0.27",
    # Keep compatibility with starlette.testclient used by integration tests.
    "anyio<4.15",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-requests",
]

[project.urls]
Documentation = "./docs/architecture.md"

[tool.hatch.build.targets.wheel]
packages = ["app"]

# ----------------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["app", "tests", "scripts"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # import sorting
    "B",    # bugbear
    "C4",   # comprehensions
    "UP",   # pyupgrade
    "SIM",  # simplify
    "RET",  # return consistency
    "ARG",  # unused arguments
    "PTH",  # prefer pathlib
    "RUF",  # ruff-specific
]
ignore = [
    "E501",    # line length is enforced by the formatter, not the linter
    "B008",    # FastAPI's Depends() in defaults is the documented idiom
    "RUF012",  # ClassVar annotations are noise on Pydantic models
]

[tool.ruff.lint.per-file-ignores]
# These modules exist precisely to handle confusable Unicode -- the fold table,
# currency symbols and locale separator sets. Flagging the characters they are
# written to normalise is a false positive.
"app/normalization/text.py" = ["RUF001"]
"app/normalization/money.py" = ["RUF001"]
"app/normalization/currency.py" = ["RUF001", "RUF003"]
"tests/unit/test_normalization_text.py" = ["RUF001"]
# Tests deliberately use assert and long descriptive names.
"tests/**" = ["ARG001", "ARG002", "ARG004", "S101"]
# Provider packages import submodules purely to trigger registration.
"app/**/providers/__init__.py" = ["F401"]
"app/ocr/__init__.py" = ["F401"]
"app/llm/__init__.py" = ["F401"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

# ----------------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = false
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
strict_equality = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# Third-party packages without bundled type information.
module = ["cv2.*", "pytesseract.*", "structlog.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Tests and scripts favour readability over exhaustive annotation.
module = ["tests.*", "scripts.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false

# --------------------------------------------------------------------- pytest
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers --strict-config"
markers = [
    "slow: tests that take more than a second",
    "requires_tesseract: needs the tesseract binary installed",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
    "ignore::ResourceWarning",
    "ignore:Using `httpx` with `starlette.testclient` is deprecated:",
    "ignore:'HTTP_422_UNPROCESSABLE_ENTITY' is deprecated:",
]


[tool.coverage.run]
source = ["app"]
omit = ["app/llm/providers/*"]  # exercised through stubs, not live calls

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@abstractmethod",
]
