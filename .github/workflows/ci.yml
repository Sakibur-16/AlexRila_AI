name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # The OCR engine is a system package. Language packs beyond English are
      # added here as OCR_LANGUAGES grows.
      - name: Install tesseract
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-eng

      - name: Install dependencies
        run: python -m pip install -e ".[dev]"

      - name: Lint
        run: |
          python -m ruff check app tests scripts
          python -m ruff format --check app tests scripts

      - name: Type check
        run: python -m mypy app

      - name: Test
        run: python -m pytest --cov=app --cov-report=term-missing

      # Golden drift is a behaviour change. It must be an explicit, reviewed
      # commit, never a silent one.
      - name: Golden regression check
        run: python scripts/generate_golden.py --check

      - name: Extraction accuracy
        run: python scripts/evaluate.py --min-exact-match 1.0

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t receipt-ocr:ci .
      - name: Verify the container serves traffic
        run: |
          docker run --rm -d --name ci-smoke -p 8000:8000 receipt-ocr:ci
          for i in $(seq 1 30); do
            if curl --fail --silent http://localhost:8000/health; then break; fi
            sleep 2
          done
          curl --fail --silent http://localhost:8000/health
          curl --fail --silent http://localhost:8000/ready
          curl --fail --silent http://localhost:8000/version
          docker stop ci-smoke
