# Build the container image and publish it to GitHub Container Registry.
#
# Runs after a push to main and on every version tag, so the backend team can
# `docker pull` a ready-made image instead of building it themselves. No extra
# credentials are needed: GITHUB_TOKEN is issued automatically to the workflow.
#
# Published as:
#   ghcr.io/<owner>/<repo>:latest      (tracks main)
#   ghcr.io/<owner>/<repo>:v1.0.0      (tagged releases)
#   ghcr.io/<owner>/<repo>:main-<sha>  (exact commit, for rollbacks)

name: Publish image

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch: # lets you trigger a build by hand from the Actions tab

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # required to push to ghcr.io

    steps:
      - uses: actions/checkout@v4

      - name: Lowercase image name
        run: |
          echo "IMAGE_NAME=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3


      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=semver,pattern=v{{version}}
            type=sha,prefix={{branch}}-

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Layer cache in the registry: Tesseract and OpenCV are the slow
          # layers and rarely change, so later builds take a fraction of the time.
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # A published image that cannot serve traffic is worse than no image, so
      # the freshly pushed one is started and probed before the job succeeds.
      - name: Smoke-test the published image
        run: |
          IMAGE=$(echo "${{ steps.meta.outputs.tags }}" | head -n1)
          echo "Testing $IMAGE"
          docker run -d --name smoke -e PORT=8000 -e WEB_CONCURRENCY=1 -p 8000:8000 "$IMAGE"
          for _ in $(seq 1 30); do
            curl -fsS http://localhost:8000/health >/dev/null 2>&1 && break
            sleep 2
          done
          echo "--- health ---"  && curl -fsS http://localhost:8000/health
          echo "--- ready  ---"  && curl -fsS http://localhost:8000/ready
          echo "--- version ---" && curl -fsS http://localhost:8000/version
          # /ready must report the OCR engine as usable inside the image.
          curl -fsS http://localhost:8000/ready | grep -q '"ready":true'
          docker rm -f smoke

      - name: Summary
        run: |
          {
            echo "### Image published"
            echo ""
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
            echo ""
            echo "Pull and run:"
            echo '```bash'
            echo "docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest"
            echo "docker run -d -p 8000:8000 -e API_KEY=<secret> ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
